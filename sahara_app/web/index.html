<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SAHARA AI — Pakistan's First Agentic Urban Crisis Response Operating System">
  <meta name="theme-color" content="#050E1F">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SAHARA AI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SAHARA AI — Crisis Intelligence Platform</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { background: #050E1F; margin: 0; padding: 0; height: 100%; }
    #boot-loader {
      position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #050E1F; color: #4D9FFF; font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      letter-spacing: 0.18em; font-size: 12px;
    }
    #boot-loader .dot {
      width: 8px; height: 8px; border-radius: 50%; background: #1E6FFF; margin-right: 10px;
      box-shadow: 0 0 12px #1E6FFF; animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 0.3 } 50% { opacity: 1 } }
  </style>
</head>
<body>
  <div id="boot-loader"><div class="dot"></div>SAHARA AI · BOOTING ANTIGRAVITY</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-loader');
      if (el) el.parentNode.removeChild(el);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
