name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - 'sahara_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:   # also manually triggerable from GitHub UI

permissions:
  contents: write   # needed for softprops/action-gh-release to create releases

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        working-directory: sahara_app
        run: flutter pub get

      - name: Build release APK
        working-directory: sahara_app
        env:
          # Production backend URL (set as GitHub repo secret SAHARA_API_BASE_URL).
          # If unset, defaults to the placeholder so the build still succeeds.
          SAHARA_API_BASE_URL: ${{ secrets.SAHARA_API_BASE_URL || 'https://sahara-ai.onrender.com' }}
        run: |
          flutter build apk --release \
            --dart-define=SAHARA_API_BASE_URL=$SAHARA_API_BASE_URL

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahara-ai-release-apk
          path: sahara_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Create GitHub Release (on main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SAHARA AI APK build ${{ github.run_number }}
          body: |
            Auto-built release APK from commit ${{ github.sha }}.

            Download `app-release.apk` below and install on your Android device.
            Enable "Install from unknown sources" if Android blocks it.
          files: sahara_app/build/app/outputs/flutter-apk/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
